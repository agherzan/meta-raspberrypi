name: Compliance

on:
  pull_request:

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the DCO image
        id: docker
        uses: ./.github/actions/docker-build
        with:
          docker_image: dco-check
      - name: Do DCO check
        run: |
          docker run --rm --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            --env "BASE_REF=$GITHUB_BASE_REF" \
            "${{ steps.docker.outputs.image }}"
      - name: Prune old CI docker images
        uses: ./.github/actions/docker-prune-images
        if: always()
      - name: Cleanup dangling docker images
        uses: ./.github/actions/docker-clean-dangling
        if: always()
  reuse:
    name: reuse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Do reuse check
        continue-on-error: true
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
